# Production deployment. Variables are resolved from the env file given on the command line:
#   docker compose --env-file .env.production up -d --build
# Start-up applies pending Prisma migrations, so the DATABASE_URL account needs DDL rights.

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
      network: host
      args:
        APP_PORT: ${APP_PORT:-3000}
    container_name: koukou
    image: fong/koukou
    # Run as a low-privilege host account that can write LOG_HOST_DIR (defaults to the image's node user).
    user: "${APP_UID:-1000}:${APP_GID:-1000}"
    network_mode: host
    environment:
      PORT: ${APP_PORT:-3000}
      # The connection string holds the DB password, so it is read from a Docker secret file.
      DATABASE_URL_FILE: /run/secrets/database_url
      # LINE credentials for reminder messages, read from Docker secret files like the connection string.
      LINE_CHANNEL_ACCESS_TOKEN_FILE: /run/secrets/line_channel_access_token
      LINE_USER_ID_FILE: /run/secrets/line_user_id
      TZ: ${TZ:-Asia/Taipei}
      LOG_FILE_ENABLED: ${LOG_FILE_ENABLED:-true}
      # Fixed path inside the container; choose the host directory with LOG_HOST_DIR instead.
      LOG_FILE_PATH: /app/logs/koukou.log
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      LOG_MAX_FILE_SIZE_MB: ${LOG_MAX_FILE_SIZE_MB:-10}
      LOG_MAX_FILES: ${LOG_MAX_FILES:-5}
    secrets:
      - database_url
      - line_channel_access_token
      - line_user_id
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "wget --quiet --tries=1 --spider http://localhost:${APP_PORT:-3000}/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      # Leave time for migrations on start-up
      start_period: 60s
    volumes:
      - ${LOG_HOST_DIR:-./logs}:/app/logs
    extra_hosts:
      - "host.docker.internal:host-gateway"

# Sensitive values are handed to the app as files under /run/secrets/ instead of environment
# variables, so they don't show up in `docker inspect` or the container's process environment.
# Each one is still sourced from the variable of the same name in the env file, so that variable
# must be defined there.
# The LINE variables may be left empty to run without reminders, but must still be defined.
secrets:
  database_url:
    environment: DATABASE_URL
  line_channel_access_token:
    environment: LINE_CHANNEL_ACCESS_TOKEN
  line_user_id:
    environment: LINE_USER_ID
