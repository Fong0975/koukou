name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  schedule:
    - cron: "0 0 15 * *" # Monthly full security scan
  workflow_dispatch: # Manual full run

# Cancel superseded runs of the same PR; never cancel runs on main.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions: {}

jobs:
  ci:
    uses: Fong0975/library-shared-workflows/.github/workflows/ci.yml@v1
    # Every scope below is required, even when a stage is disabled: GitHub checks
    # the permissions of all nested jobs when the run starts.
    permissions:
      contents: read
      pull-requests: write
      pages: write
      id-token: write
    secrets:
      APP_ID: ${{ secrets.APP_ID }}
      APP_PRIVATE_KEY: ${{ secrets.APP_PRIVATE_KEY }}
    with:
      # DATABASE_URL is a placeholder: prisma.config.ts resolves it during `npm ci`
      # (postinstall `prisma generate`) and src/lib/db.ts requires it to exist, but no
      # job opens a database connection.
      projects: |
        [
          {
            "name": "app",
            "language": "node",
            "env": {
              "NEXT_TELEMETRY_DISABLED": "1",
              "DATABASE_URL": "mysql://ci:ci@localhost:3306/koukou"
            },
            "coverage-threshold": 85
          }
        ]
      enable-security-scan: true
      semgrep-configs: p/security-audit p/owasp-top-ten p/typescript p/react p/nextjs
      enable-swagger: false
      enable-bump-version: true
      bump-level: minor
      # Changes that do not affect the shipped app do not produce a new version.
      bump-paths: '["**", "!**/*.md", "!.github/**", "!LICENSE", "!.editorconfig", "!.gitattributes", "!.gitignore"]'
