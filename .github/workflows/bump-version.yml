# Manual version bump. Automatic bumps run from ci.yml on pushes to main; keep any
# version settings passed in `with:` identical to the ones in ci.yml.
name: Bump Version

on:
  workflow_dispatch:
    inputs:
      bump_type:
        description: Version bump type
        required: true
        default: minor
        type: choice
        options:
          - patch
          - minor
          - major
      notes:
        description: Optional release notes (appended to the commit body)
        required: false
        type: string

permissions: {}

jobs:
  bump:
    uses: Fong0975/library-shared-workflows/.github/workflows/bump-version.yml@v1
    permissions:
      contents: read
    secrets:
      APP_ID: ${{ secrets.APP_ID }}
      APP_PRIVATE_KEY: ${{ secrets.APP_PRIVATE_KEY }}
    with:
      bump-level: ${{ inputs.bump_type }}
      notes: ${{ inputs.notes }}
